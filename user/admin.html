<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Study Hub Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #6c5ce7; --bg: #f4f7f6; --dark: #2d3436; 
            --accent: #2ecc71; --error: #e74c3c; --blue: #3498db;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--dark); padding-bottom: 50px; }

        /* Navigation Bar */
        #admin-bar { 
            background: var(--dark); padding: 15px; position: sticky; top: 0; 
            z-index: 2000; border-bottom: 3px solid var(--accent); 
            display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .admin-btn { 
            background: var(--accent); color: white; border: none; padding: 10px 18px; 
            border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px; transition: all 0.2s ease;
        }
        .admin-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        
        /* Breadcrumbs */
        .breadcrumb-nav { 
            background: white; padding: 15px 25px; border-radius: 12px; 
            margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.08);
            display: flex; align-items: center; justify-content: space-between;
        }
        #bc-container { font-size: 0.9rem; font-weight: 600; color: var(--primary); }
        .bc-link { cursor: pointer; text-decoration: none; color: var(--primary); }
        .bc-link:hover { text-decoration: underline; }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { 
            background: white; padding: 30px 20px; border-radius: 15px; text-align: center; 
            position: relative; border: 1px solid #ddd; cursor: pointer; transition: 0.2s;
        }
        .card:hover { border-color: var(--primary); transform: translateY(-5px); }
        
        /* List View for Units */
        .unit-item { 
            background: white; padding: 15px 20px; margin-bottom: 10px; border-radius: 10px; 
            border-left: 5px solid var(--primary); display: flex; 
            justify-content: space-between; align-items: center; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: background 0.2s;
        }
        .unit-item:hover { background: #fdfdff; }

        /* Editing Panel */
        #editPanel { 
            background: white; padding: 25px; border-radius: 15px; 
            border: 2px solid var(--primary); margin-top: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        label { font-size: 0.85rem; font-weight: 600; color: #555; }
        input { width: 100%; padding: 12px; margin: 6px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 5px rgba(108, 92, 231, 0.2); }

        /* Inbox Panel */
        #message-panel { 
            position: fixed; inset: 0; background: white; z-index: 3000; 
            display: none; flex-direction: column; padding: 30px; 
        }
        .msg-card { background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--blue); }
        
        .badge { background: #eee; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; position: absolute; top: 10px; left: 10px; font-weight: 600; }
    </style>
</head>
<body>

<div id="admin-bar">
    <button class="admin-btn" onclick="addNewNode()"><i class="fa-solid fa-folder-plus"></i> New Folder/Subject</button>
    <button class="admin-btn" id="v2-btn" onclick="toggleV2()">V2: OFF</button>
    <button class="admin-btn" style="background:var(--blue);" onclick="openInbox()"><i class="fa-solid fa-envelope"></i> Reports</button>
    <button class="admin-btn" style="background:var(--error);" onclick="location.href='index.html'"><i class="fa-solid fa-eye"></i> View Portal</button>
</div>

<div class="container">
    <div class="breadcrumb-nav">
        <div id="bc-container">Home</div>
        <button class="admin-btn" id="back-btn" style="background:var(--dark); display:none;" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> Back</button>
    </div>

    <div id="mainGrid" class="grid"></div>

    <div id="subjectView" style="display:none;">
        <div id="unitList"></div>
        <button class="admin-btn" style="width:100%; background:var(--primary); margin-top:10px; justify-content:center;" onclick="addUnit()"><i class="fa-solid fa-plus"></i> Add New Resource</button>
        
        <div id="editPanel" style="display:none;">
            <h3 style="margin-bottom:15px; color:var(--primary);"><i class="fa-solid fa-pen-to-square"></i> Edit Resource</h3>
            <label>Resource Title</label>
            <input type="text" id="editName" placeholder="e.g. UNIT - 1 Notes">
            <label>PDF / Document Link</label>
            <input type="text" id="editPdf" placeholder="https://...">
            <label>YouTube Video Link (Optional)</label>
            <input type="text" id="editVid" placeholder="https://youtube.com/watch?v=...">
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="admin-btn" style="flex:1; justify-content:center;" onclick="saveEdit()"><i class="fa-solid fa-floppy-disk"></i> Save Update</button>
                <button class="admin-btn" style="background:var(--error); flex:1; justify-content:center;" onclick="deleteUnit()"><i class="fa-solid fa-trash"></i> Delete Resource</button>
            </div>
        </div>
    </div>
</div>

<div id="message-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:2px solid #eee; padding-bottom:15px;">
        <h2><i class="fa-solid fa-inbox" style="color:var(--blue);"></i> Student Support Reports</h2>
        <button class="admin-btn" style="background:var(--dark);" onclick="document.getElementById('message-panel').style.display='none'"><i class="fa-solid fa-xmark"></i> Close</button>
    </div>
    <div id="inbox-list" style="overflow-y:auto; flex:1;"></div>
    <button class="admin-btn" style="background:var(--error); margin-top:15px; align-self:flex-start;" onclick="clearMsg()"><i class="fa-solid fa-trash"></i> Clear All Reports</button>
</div>

<script type="module">
    import { docRef, settingsRef, msgRef } from './studyfirebase-config.js';
    import { setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    let core = {}; 
    let path = []; 
    let selectedUnitIdx = null;
    let v2Enabled = false;

    // --- REAL-TIME DATA SYNC ---
    onSnapshot(docRef, (snap) => {
        if(snap.exists()) {
            core = snap.data();
            render();
        }
    });

    onSnapshot(settingsRef, (snap) => {
        if(snap.exists()) {
            const data = snap.data();
            v2Enabled = !!data.v2Enabled;
            const btn = document.getElementById('v2-btn');
            btn.innerText = `V2: ${v2Enabled ? 'ON' : 'OFF'}`;
            btn.style.background = v2Enabled ? 'var(--accent)' : '#f39c12';
        }
    });

    // --- RENDER ENGINE ---
    window.render = () => {
        const grid = document.getElementById('mainGrid');
        const subjectView = document.getElementById('subjectView');
        const unitList = document.getElementById('unitList');
        const backBtn = document.getElementById('back-btn');
        
        grid.innerHTML = '';
        unitList.innerHTML = '';
        
        // Update Breadcrumbs
        let bcHtml = `<span class="bc-link" onclick="jumpTo(-1)">Home</span>`;
        path.forEach((p, i) => { bcHtml += ` > <span class="bc-link" onclick="jumpTo(${i})">${p}</span>`; });
        document.getElementById('bc-container').innerHTML = bcHtml;
        backBtn.style.display = path.length > 0 ? 'block' : 'none';

        // Get Current Level
        let target = core;
        path.forEach(p => { if(target) target = target[p]; });

        if(!target) { 
            path = []; 
            render(); 
            return; 
        }

        // Check if current target is a Subject (has units) or a Folder
        if(target._type === 'subject') {
            grid.style.display = 'none';
            subjectView.style.display = 'block';
            (target.units || []).forEach((u, i) => {
                unitList.innerHTML += `
                    <div class="unit-item" onclick="openEdit(${i})">
                        <span><i class="fa-solid fa-file-pdf" style="color:var(--primary); margin-right:8px;"></i> ${u}</span>
                        <i class="fa-solid fa-pen-to-square" style="color:var(--primary);"></i>
                    </div>`;
            });
        } else {
            grid.style.display = 'grid';
            subjectView.style.display = 'none';
            document.getElementById('editPanel').style.display = 'none';

            const keys = Object.keys(target).filter(k => !k.startsWith('_')).sort((a,b) => (target[a]._rank || 99) - (target[b]._rank || 99));
            
            keys.forEach(k => {
                const isSubj = target[k] && target[k]._type === 'subject';
                grid.innerHTML += `
                    <div class="card" onclick="moveIn('${k}')">
                        <div class="badge">Rank: ${target[k]._rank || '99'}</div>
                        <i class="fa-solid ${isSubj ? 'fa-book-bookmark' : (path.length === 0 ? 'fa-graduation-cap' : 'fa-folder-open')}" style="font-size:2.5rem; color:var(--primary); margin-bottom:15px;"></i>
                        <h3 style="font-size:1rem;">${k}</h3>
                        <div style="margin-top:20px; display:flex; justify-content:center; gap:20px; color:#aaa;">
                            <i class="fa-solid fa-sort" onclick="event.stopPropagation(); setRank('${k}')" title="Set Sort Order"></i>
                            <i class="fa-solid fa-trash" style="color:var(--error)" onclick="event.stopPropagation(); deleteNode('${k}')" title="Delete Item"></i>
                        </div>
                    </div>`;
            });
        }
    };

    // --- NAVIGATION ---
    window.moveIn = (key) => { path.push(key); render(); };
    window.goBack = () => { path.pop(); render(); };
    window.jumpTo = (idx) => { path = path.slice(0, idx + 1); render(); };

    // --- ACTION FUNCTIONS ---
    window.addNewNode = async () => {
        const name = prompt("Enter Name (Subject or Folder):");
        if(!name) return;
        let t = core;
        path.forEach(p => t = t[p]);
        
        // If inside a folder, default to subject; otherwise folder
        t[name] = path.length >= 1 ? { _type:'subject', units:[], links:[], vids:[], _rank: 99 } : { _rank: 99 };
        await setDoc(docRef, core);
        render();
    };

    window.deleteNode = async (key) => {
        if(confirm(`Delete "${key}" and everything inside it?`)) {
            let t = core;
            path.forEach(p => t = t[p]);
            delete t[key];
            await setDoc(docRef, core);
            render();
        }
    };

    window.setRank = async (key) => {
        let t = core;
        path.forEach(p => t = t[p]);
        const r = prompt("Enter Sort Order (1, 2, 3...):", t[key]._rank || "99");
        if(r !== null) {
            t[key]._rank = parseInt(r) || 99;
            await setDoc(docRef, core);
            render();
        }
    };

    window.openEdit = (idx) => {
        selectedUnitIdx = idx;
        let t = core; path.forEach(p => t = t[p]);
        document.getElementById('editPanel').style.display = 'block';
        document.getElementById('editName').value = t.units[idx] || '';
        document.getElementById('editPdf').value = t.links[idx] || '';
        document.getElementById('editVid').value = (t.vids && t.vids[idx]) ? t.vids[idx] : '';
    };

    window.saveEdit = async () => {
        let t = core; path.forEach(p => t = t[p]);
        t.units[selectedUnitIdx] = document.getElementById('editName').value;
        t.links[selectedUnitIdx] = document.getElementById('editPdf').value;
        if(!t.vids) t.vids = [];
        t.vids[selectedUnitIdx] = document.getElementById('editVid').value;
        await setDoc(docRef, core);
        document.getElementById('editPanel').style.display = 'none';
        alert("Resource Updated Successfully!");
        render();
    };

    window.addUnit = async () => {
        let t = core; path.forEach(p => t = t[p]);
        if(!t.units) t.units = [];
        if(!t.links) t.links = [];
        if(!t.vids) t.vids = [];
        t.units.push("New Unit Resource");
        t.links.push("#");
        t.vids.push("");
        await setDoc(docRef, core);
        openEdit(t.units.length - 1);
        render();
    };

    window.deleteUnit = async () => {
        if(confirm("Delete this unit resource?")) {
            let t = core; path.forEach(p => t = t[p]);
            t.units.splice(selectedUnitIdx, 1);
            t.links.splice(selectedUnitIdx, 1);
            if(t.vids) t.vids.splice(selectedUnitIdx, 1);
            await setDoc(docRef, core);
            document.getElementById('editPanel').style.display = 'none';
            render();
        }
    };

    window.toggleV2 = async () => {
        await setDoc(settingsRef, { v2Enabled: !v2Enabled });
    };

    window.openInbox = async () => {
        const snap = await getDoc(msgRef);
        const l = document.getElementById('inbox-list');
        l.innerHTML = '';
        if(snap.exists()) {
            const data = snap.data();
            const reports = data.reports || data.inbox || [];
            if(reports.length === 0) {
                l.innerHTML = '<p style="color:#aaa; text-align:center; padding:30px;">No student reports yet.</p>';
            } else {
                reports.slice().reverse().forEach(m => {
                    const time = m.time || m.timestamp || 'N/A';
                    const msg = m.text || m.message || 'No text';
                    const route = m.path ? `<br><small style="color:var(--primary);">Path: ${m.path}</small>` : '';
                    l.innerHTML += `
                        <div class="msg-card">
                            <strong style="color:#555; font-size:0.8rem;"><i class="fa-regular fa-clock"></i> ${time}</strong>
                            <p style="margin-top:5px; color:#2d3436;">${msg}</p>
                            ${route}
                        </div>`;
                });
            }
        }
        document.getElementById('message-panel').style.display = 'flex';
    };

    window.clearMsg = async () => { 
        if(confirm("Clear all student reports?")) {
            await setDoc(msgRef, { reports: [], inbox: [] }); 
            openInbox();
        }
    };

</script>
</body>
</html>
