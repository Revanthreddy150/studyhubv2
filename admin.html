<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Page Image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .fullscreen-image {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Change to 'contain' to avoid cropping */
      display: block;
    }
  </style>
</head>
<body>

  <img 
    class="fullscreen-image" 
    src="https://c-sf.smule.com/rs-s24/arr/6a/2b/93656b62-2a01-4649-b2f3-84e9d0dde40a.jpg" 
    alt="Full page visual"
  >

</body>
</html>
